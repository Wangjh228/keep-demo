body {

/* ── Phone ─────────────────────────────── */

}

}
.top-tab.active { color: #111; }
.top-tab.active::after {

  width: 24px; height: 2px; background: #111; border-radius: 1px;
}
.icon-row { display: flex; justify-content: space-around; padding: 16px 8px 8px; }
.icon-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon-box {

.icon-label { font-size: 11px; color: #555; }
.filter-row {

.chip {

.section-label { padding: 6px 16px 2px; font-size: 13px; color: #aaa; }

}
.course-card:active { background: #f9f9f9; }
.course-thumb {

}
.badge {

  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  color: #fff; font-weight: 600; z-index: 1;
}
.badge.free { background: var(--green); }
.badge.official { background: #f59e0b; }
.course-info { flex: 1; min-width: 0; }
.c-title {
  font-size: 14px; font-weight: 500; color: #111; line-height: 1.45;

  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.c-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; color: #aaa; }
.c-desc { font-size: 11px; color: #ccc; margin-top: 3px; }
.bottom-nav {

  padding: 8px 0 28px; flex-shrink: 0;
}
.nav-item { flex: 1; text-align: center; font-size: 11px; color: #aaa; padding: 4px 0; }
.nav-item.active { color: var(--green); font-weight: 600; }
.nav-dot { width: 5px; height: 5px; border-radius: 50%; background: #f55; margin: 0 auto 2px; }

/* ══════════════════════════════════════════
   DETAIL
══════════════════════════════════════════ */
.detail-nav {

}
.nav-right { display: flex; gap: 18px; color: #555; font-size: 17px; }
.course-cover { width: 100%; padding-bottom: 56.25%; position: relative; flex-shrink: 0; }
.cover-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.play-circle {

  background: rgba(255,255,255,.8);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.cover-tag {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(0,0,0,.45); color: #fff;
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
}
.d-rating { padding: 10px 16px 2px; display: flex; align-items: center; gap: 4px; font-size: 14px; color: #555; }
.star { color: #f59e0b; }
.d-title { padding: 4px 16px 10px; font-size: 20px; font-weight: 700; line-height: 1.3; color: #111; }
.stats-strip {

}
.stat-block { display: flex; flex-direction: column; }
.stat-v { font-size: 16px; font-weight: 700; color: #111; }
.stat-l { font-size: 11px; color: #aaa; margin-top: 1px; }
.v-divider { width: 1px; height: 26px; background: #eee; }
.keep-tag {

.d-instructor { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.instr-av {

}
.d-desc { padding: 2px 16px 14px; font-size: 13px; color: #666; line-height: 1.7; }
.d-desc .more { color: var(--green); }

/* 种草入口矩形卡 */
.grass-entry {
  margin: 0 16px 14px;

  border-radius: 12px;
  padding: 12px 14px;

  transition: background .12s;
}

.grass-entry-q { font-size: 14px; font-weight: 600; color: #111; }

.action-strip { display: flex; border-top: 1px solid #f5f5f5; border-bottom: 1px solid #f5f5f5; }
.act-item {

}
.act-icon { font-size: 19px; }
.go-bar { display: flex; align-items: center; padding: 14px 16px 36px; gap: 12px; }
.mode-btn, .equip-btn {
  flex: 1; padding: 13px 0; border: 1px solid #e0e0e0; border-radius: 28px;
  background: #fff; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px; color: #333;
}
.go-btn {
  width: 66px; height: 66px; border-radius: 50%;
  background: var(--green); color: #fff; font-size: 20px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}

/* ══════════════════════════════════════════
   BOTTOM SHEET — 固定高度 + 下滑关闭
══════════════════════════════════════════ */
.overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0);
  z-index: 200;
  pointer-events: none;
  transition: background .3s;
}
.overlay.open { background: rgba(0,0,0,.45); pointer-events: all; }
.sheet {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 88%;                        /* 固定高度 */
  background: #f7f7f7;
  border-radius: 20px 20px 0 0;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
  overflow: hidden;
  will-change: transform;
}
.overlay.open .sheet { transform: translateY(0); }
.sheet-handle-wrap {
  padding: 10px 0 4px;
  display: flex; justify-content: center;
  cursor: grab; flex-shrink: 0;
  touch-action: none;
}
.sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; }
.sheet-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 18px 10px; flex-shrink: 0; background: #f7f7f7;
}
.sheet-hd-title { font-size: 15px; font-weight: 600; color: #111; }
.close-btn {
  width: 28px; height: 28px; border-radius: 50%; background: #e8e8e8;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; color: #666;
}

/* Chat area */
.chat-area {
  flex: 1; overflow-y: auto;
  padding: 12px 14px 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* 用户消息（右对齐） */
.msg-user { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.user-course-card {
  background: #fff; border-radius: 12px; border: 1px solid #ebebeb;
  padding: 10px 12px; display: flex; gap: 9px; align-items: center;

}
.user-card-thumb { width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0; }
.user-card-name { font-size: 12px; font-weight: 600; color: #111; line-height: 1.4; }
.user-card-meta { font-size: 11px; color: #aaa; margin-top: 2px; }
.bubble-user-q {
  background: var(--green);
  color: #fff;
  border-radius: 16px 4px 16px 16px;
  padding: 9px 13px;
  font-size: 14px;
  max-width: 70%;
  line-height: 1.5;
}

/* 卡卡消息（左对齐） */
.msg-kaka { display: flex; align-items: flex-start; gap: 8px; }
.kaka-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0;
  margin-top: 2px;
}
.bubble-kaka {
  background: #fff;
  border-radius: 4px 16px 16px 16px;
  padding: 12px 14px;
  font-size: 14px; color: #222; line-height: 1.85;
  max-width: calc(100% - 44px);
  border: 1px solid #ebebeb;
}
.bubble-kaka strong { font-weight: 700; }
.bubble-kaka p { margin: 0; }
.bubble-kaka p + p { margin-top: 10px; }

/* Loading dots */
.dot-loading { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.dot-loading span {
  width: 7px; height: 7px; border-radius: 50%; background: #bbb;
  animation: dl 1.1s infinite;
}
.dot-loading span:nth-child(2) { animation-delay: .18s; }
.dot-loading span:nth-child(3) { animation-delay: .36s; }
@keyframes dl {
  0%,80%,100% { transform: scale(.55); opacity: .35; }
  40%          { transform: scale(1);   opacity: 1; }
}
.cursor-blink {
  display: inline-block; width: 2px; height: 14px;
  background: #555; margin-left: 1px; vertical-align: middle;
  animation: cb .75s infinite;
}
@keyframes cb { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Sheet course header ────────────── */
.sheet-course-hd {
  display: flex; gap: 12px; align-items: center;
  padding: 10px 16px 12px; background: #f7f7f7;
  border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
}
.sheet-cover-thumb {

.sheet-cover-play {

  font-size: 11px; color: #333;
}
.sheet-course-name {
  font-size: 14px; font-weight: 600; color: #111; line-height: 1.4;

.sheet-course-meta { font-size: 12px; color: #888; margin-top: 4px; }

/* ── Chat input bar ─────────────────── */
.sheet-input-bar {

  padding: 10px 14px 26px; background: #fff;
  border-top: 1px solid #f0f0f0; flex-shrink: 0;
}
.chat-input {
  flex: 1; background: #f4f4f4; border: none; border-radius: 20px;
  padding: 9px 14px; font-size: 14px; outline: none; color: #111;
  font-family: inherit;
}
.chat-input::placeholder { color: #bbb; }
.chat-send-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--green); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: #fff; flex-shrink: 0; line-height: 1;
  transition: background .15s;
}
.chat-send-btn:disabled { background: #ddd; cursor: default; }
</style>
</head>

══════════════════════════════════════════════════════ */
document.getElementById('overlay').addEventListener('click', e => {

});

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
}

// Swipe down to close
(function() {
  const wrap  = document.getElementById('sheet-handle-wrap');
  const sheet = document.getElementById('sheet');
  let startY = 0, dragging = false;

  wrap.addEventListener('touchstart', e => {
    startY   = e.touches[0].clientY;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });

  wrap.addEventListener('touchend', e => {
    dragging = false;
    sheet.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 90) {
      closeSheet();
      sheet.style.transform = '';
    } else {
      sheet.style.transform = '';
    }
  });

  // Mouse drag (desktop testing)
  wrap.addEventListener('mousedown', e => {
    startY   = e.clientY;
    dragging = true;
    sheet.style.transition = 'none';
    const onMove = ev => {
      if (!dragging) return;
      const dy = ev.clientY - startY;
      if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
    };
    const onUp = ev => {
      dragging = false;
      sheet.style.transition = '';
      const dy = ev.clientY - startY;
      if (dy > 90) { closeSheet(); sheet.style.transform = ''; }
      else sheet.style.transform = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

/* ══════════════════════════════════════════════════════
   DIFY CALL
══════════════════════════════════════════════════════ */
async function callDify(course) {
  const bubble = document.getElementById('kaka-bubble');

  // Mock mode fallback（API 不通时）
  const useMock = !DIFY.apiKey || DIFY.apiKey.startsWith('YOUR');
  if (useMock) {
    await mockStream(course.mockGrass, bubble);
    return;
  }

  abortCtrl = new AbortController();
  try {
    const res = await fetch(`${DIFY.baseUrl}/v1/workflows/run`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${DIFY.apiKey}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        inputs: {
          course_id: course.courseId,
          userId:    course.userId,
          biz:       DIFY.biz,
          tags:      DIFY.tags,
        },
        response_mode: 'streaming',
        user: 'keep-demo',
      }),
      signal: abortCtrl.signal,
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', accumulated = '', started = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        try {
          const d = JSON.parse(raw);

          // 流式 token（text_chunk 或 node 流式输出）
          const chunk = d.data?.text ?? d.answer ?? d.text ?? '';
          if (chunk) {
            if (!started) { bubble.innerHTML = ''; started = true; }
            accumulated += chunk;
            bubble.innerHTML = md(accumulated) + '<span class="cursor-blink"></span>';
            bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }

          // 最终输出
          if (d.event === 'workflow_finished') {
            const finalText = d.data?.outputs?.text ?? accumulated;
            bubble.innerHTML = md(finalText);
          }
        } catch (_) {}
      }
    }

    if (!started) {
      bubble.innerHTML = `<span style="color:#aaa;font-size:13px">暂未获取到分析结果</span>`;
    } else {
      bubble.innerHTML = md(accumulated);
    }

  } catch (err) {
    if (err.name === 'AbortError') return;
    // 降级到 mock
    await mockStream(course.mockGrass, bubble);
  }

  // 初始回答完成，开启输入框
  document.getElementById('chat-send').disabled = false;
  document.getElementById('chat-input').focus();
}

/* ══════════════════════════════════════════════════════

document.getElementById('chat-send').addEventListener('click', sendChat);

async function sendChat() {
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  sendBtn.disabled = true;

  const area = document.getElementById('chat-area');

  // 追加用户气泡
  const userDiv = document.createElement('div');
  userDiv.className = 'msg-user';
  userDiv.innerHTML = `<div class="bubble-user-q">${text.replace(/</g,'&lt;')}</div>`;
  area.appendChild(userDiv);

  // 追加卡卡 loading
  const kakaDiv = document.createElement('div');
  kakaDiv.className = 'msg-kaka';
  kakaDiv.innerHTML = `
    <div class="kaka-av">K</div>
    <div class="bubble-kaka"><div class="dot-loading"><span></span><span></span><span></span></div></div>
  `;
  area.appendChild(kakaDiv);
  area.scrollTop = area.scrollHeight;

  const bubble = kakaDiv.querySelector('.bubble-kaka');
  await callDifyChat(text, bubble);

  sendBtn.disabled = false;
  input.focus();
}

async function callDifyChat(query, bubble) {
  const useMock = !DIFY.apiKey || DIFY.apiKey.startsWith('YOUR');
  if (useMock) {
    await mockStream(mockChatReply(query), bubble);
    return;
  }

  abortCtrl = new AbortController();
  try {
    const res = await fetch(`${DIFY.baseUrl}/v1/chat-messages`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${DIFY.apiKey}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        inputs: {},
        query,
        response_mode: 'streaming',
        conversation_id: conversationId ?? '',
        user: 'keep-demo',
      }),
      signal: abortCtrl.signal,
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', accumulated = '', started = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        try {
          const d = JSON.parse(raw);
          if (d.conversation_id) conversationId = d.conversation_id;
          const chunk = d.answer ?? d.text ?? '';
          if (chunk) {
            if (!started) { bubble.innerHTML = ''; started = true; }
            accumulated += chunk;
            bubble.innerHTML = md(accumulated) + '<span class="cursor-blink"></span>';
            bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        } catch (_) {}
      }
    }

    bubble.innerHTML = md(accumulated || '好的，还有什么想问的？');
  } catch (err) {
    if (err.name === 'AbortError') return;
    await mockStream(mockChatReply(query), bubble);
  }
}

function mockChatReply(q) {
  const c = currentCourse;
  const lower = q.toLowerCase();
  if (/每天|频率|多久/.test(q))
    return `这节课 ${c.duration} 分钟，强度${c.difficulty === 'K1' ? '较低，每天练都没问题 💪' : '中等，建议每周练 3-4 次，给肌肉留点恢复时间～'}`;
  if (/热量|卡路里|消耗/.test(q))
    return `这节课预计消耗 ${c.calMin}–${c.calMax} 千卡，配合饮食控制效果会更明显哦！`;
  if (/难吗|难度|跟不上/.test(q))
    return `${c.difficulty} ${c.level}难度，${c.level === '零基础' ? '完全不用担心，跟着节奏来就行～' : '有一定基础更好上手，跟不上就暂停休息一下，别勉强。'}`;
  if (/器材|器械|装备/.test(q))
    return c.category === '力量'
      ? `这节课需要哑铃或相应器械，找不到可以用矿泉水瓶替代轻重量练练感觉～`
      : `这节课不需要任何器材，一张垫子就够了 ✅`;
  return `好问题！关于「${q.slice(0,12)}」—— 根据你目前的状态，我建议你先从这节课开始体验，完成后身体会给你最直接的反馈。遇到不适随时停下来休息哦～`;
}

/* ── Markdown（**bold** + 换行） ─── */
function md(text) {
  const escaped = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

/* ── Mock 流式 ──────────────────── */
async function mockStream(text, bubble) {
  await sleep(600);
  bubble.innerHTML = '';
  let rendered = '';
  for (let i = 0; i < text.length; i++) {
    rendered += text[i];
    bubble.innerHTML = md(rendered) + '<span class="cursor-blink"></span>';
    bubble.parentElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
    await sleep(15 + Math.random() * 12);
  }
  bubble.innerHTML = md(rendered);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
